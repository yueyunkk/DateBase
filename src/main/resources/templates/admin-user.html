<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">用户管理</h3>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>真实姓名</th>
            <th>性别</th>
            <th>电话</th>
            <th>邮箱</th>
            <th>角色</th>
            <th>状态</th>
            <th>注册时间</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.userId}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.realName}"></td>
            <td th:text="${u.gender}"></td>
            <td th:text="${u.phone}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <span class="badge bg-primary" th:if="${u.role == 'admin'}">管理员</span>
                <span class="badge bg-secondary" th:if="${u.role == 'user'}">普通用户</span>
            </td>
            <td>
                <span class="badge bg-success" th:if="${u.status == 1}">正常</span>
                <span class="badge bg-danger" th:if="${u.status == 0}">禁用</span>
            </td>
            <td th:text="${#temporals.format(u.registerTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
