<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card img{
            height:220px;
            object-fit:cover;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/product/add}">发布商品</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">商品列表</h3>

    <form class="row g-3 mb-4" method="get" th:action="@{/product/search}">
        <div class="col-md-3">
            <input type="text" name="keyword" class="form-control" placeholder="请输入商品名称关键字">
        </div>
        <div class="col-md-2">
            <select name="categoryId" class="form-select">
                <option value="">全部分类</option>
                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <input type="number" step="0.01" name="minPrice" class="form-control" placeholder="最低价">
        </div>
        <div class="col-md-2">
            <input type="number" step="0.01" name="maxPrice" class="form-control" placeholder="最高价">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary" type="submit">搜索</button>
            <a class="btn btn-secondary" th:href="@{/product/list}">重置</a>
        </div>
    </form>

    <div class="row">
        <div class="col-md-3 mb-4" th:each="p : ${products}">
            <div class="card product-card h-100">
                <img th:src="${p.imageUrl}" class="card-img-top" alt="商品图片">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.productName}"></h5>
                    <p class="text-danger fw-bold mb-1">¥<span th:text="${p.price}"></span></p>
                    <p class="mb-1">分类：<span th:text="${p.categoryName}"></span></p>
                    <p class="mb-1">卖家：<span th:text="${p.sellerName}"></span></p>
                    <p>
                        <span class="badge bg-success" th:if="${p.status == 'ON_SALE'}">在售</span>
                        <span class="badge bg-secondary" th:if="${p.status == 'OFF_SALE'}">下架</span>
                        <span class="badge bg-danger" th:if="${p.status == 'SOLD'}">已售</span>
                    </p>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{'/product/detail/' + ${p.productId}}">查看详情</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
