<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>分类管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">分类管理</h3>

    <div class="card mb-4">
        <div class="card-header">新增分类</div>
        <div class="card-body">
            <form method="post" th:action="@{/category/add}">
                <div class="row">
                    <div class="col-md-3">
                        <input type="text" name="categoryName" class="form-control" placeholder="分类名称" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="categoryDesc" class="form-control" placeholder="分类描述">
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="sortNo" class="form-control" placeholder="排序号" value="0">
                    </div>
                    <div class="col-md-2">
                        <select name="status" class="form-select">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-primary w-100">添加</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>分类名称</th>
            <th>描述</th>
            <th>排序号</th>
            <th>状态</th>
            <th width="120">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.categoryId}"></td>
            <td th:text="${c.categoryName}"></td>
            <td th:text="${c.categoryDesc}"></td>
            <td th:text="${c.sortNo}"></td>
            <td>
                <span class="badge bg-success" th:if="${c.status == 1}">启用</span>
                <span class="badge bg-secondary" th:if="${c.status == 0}">禁用</span>
            </td>
            <td>
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{'/category/delete/' + ${c.categoryId}}"
                   onclick="return confirm('确认删除该分类吗？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
