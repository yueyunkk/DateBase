<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-4">个人中心</h3>

    <form method="post" th:action="@{/user/update}">
        <input type="hidden" name="userId" th:value="${user.userId}">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" th:value="${user.username}" readonly>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">真实姓名</label>
                <input type="text" name="realName" class="form-control" th:value="${user.realName}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">性别</label>
                <select name="gender" class="form-select">
                    <option value="">请选择</option>
                    <option value="男" th:selected="${user.gender == '男'}">男</option>
                    <option value="女" th:selected="${user.gender == '女'}">女</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">手机号</label>
                <input type="text" name="phone" class="form-control" th:value="${user.phone}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" name="email" class="form-control" th:value="${user.email}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">角色</label>
                <input type="text" class="form-control" th:value="${user.role}" readonly>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>
</body>
</html>
