<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/order/my-buy}">我的购买</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/order/my-sell}">我的出售</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3" th:if="${type == 'buy'}">我的购买订单</h3>
    <h3 class="mb-3" th:if="${type == 'sell'}">我的出售订单</h3>
    <h3 class="mb-3" th:if="${type == 'admin'}">全部订单</h3>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>订单ID</th>
            <th>商品名称</th>
            <th>买家</th>
            <th>卖家</th>
            <th>金额</th>
            <th>订单状态</th>
            <th>下单时间</th>
            <th width="220">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.orderId}"></td>
            <td th:text="${o.productName}"></td>
            <td th:text="${o.buyerName}"></td>
            <td th:text="${o.sellerName}"></td>
            <td class="text-danger">¥<span th:text="${o.orderPrice}"></span></td>
            <td>
                <span class="badge bg-warning text-dark" th:if="${o.orderStatus == 'PENDING'}">待处理</span>
                <span class="badge bg-success" th:if="${o.orderStatus == 'COMPLETED'}">已完成</span>
                <span class="badge bg-danger" th:if="${o.orderStatus == 'CANCELLED'}">已取消</span>
            </td>
            <td th:text="${#temporals.format(o.orderTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/product/detail/' + ${o.productId}}">查看商品</a>

                <a class="btn btn-sm btn-outline-success"
                   th:if="${type == 'sell' and o.orderStatus == 'PENDING'}"
                   th:href="@{'/order/complete/' + ${o.orderId}}">完成订单</a>

                <a class="btn btn-sm btn-outline-danger"
                   th:if="${type == 'buy' and o.orderStatus == 'PENDING'}"
                   th:href="@{'/order/cancel/' + ${o.orderId}}">取消订单</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
