<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/product/my}">我的商品</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-4">发布商品</h3>

    <form method="post" th:action="@{/product/add}">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">商品名称</label>
                <input type="text" name="productName" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">所属分类</label>
                <select name="categoryId" class="form-select" required>
                    <option value="">请选择分类</option>
                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">售价</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">原价</label>
                <input type="number" step="0.01" name="originalPrice" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">成色</label>
                <select name="qualityLevel" class="form-select">
                    <option value="全新">全新</option>
                    <option value="9成新">9成新</option>
                    <option value="8成新">8成新</option>
                    <option value="7成新">7成新</option>
                    <option value="6成新">6成新</option>
                </select>
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label">图片地址</label>
                <input type="text" name="imageUrl" class="form-control" placeholder="请输入图片URL，例如 https://picsum.photos/300/200">
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label">商品描述</label>
                <textarea name="productDesc" rows="5" class="form-control"></textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">提交发布</button>
        <a class="btn btn-secondary" th:href="@{/product/my}">返回</a>
    </form>
</div>
</body>
</html>
