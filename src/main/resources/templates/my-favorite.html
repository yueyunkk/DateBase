<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的收藏</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/product/list}">商品列表</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">我的收藏</h3>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>商品名称</th>
            <th>卖家</th>
            <th>价格</th>
            <th>收藏时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${favorites}">
            <td th:text="${f.favoriteId}"></td>
            <td th:text="${f.productName}"></td>
            <td th:text="${f.sellerName}"></td>
            <td class="text-danger">¥<span th:text="${f.price}"></span></td>
            <td th:text="${#temporals.format(f.favoriteTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/product/detail/' + ${f.productId}}">查看</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{'/favorite/remove/' + ${f.productId}}">取消收藏</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
