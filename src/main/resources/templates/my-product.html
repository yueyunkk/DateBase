<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/product/add}">发布商品</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">我的商品</h3>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>商品名称</th>
            <th>分类</th>
            <th>价格</th>
            <th>状态</th>
            <th>发布时间</th>
            <th width="260">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.productId}"></td>
            <td th:text="${p.productName}"></td>
            <td th:text="${p.categoryName}"></td>
            <td class="text-danger">¥<span th:text="${p.price}"></span></td>
            <td>
                <span class="badge bg-success" th:if="${p.status == 'ON_SALE'}">在售</span>
                <span class="badge bg-secondary" th:if="${p.status == 'OFF_SALE'}">下架</span>
                <span class="badge bg-danger" th:if="${p.status == 'SOLD'}">已售</span>
            </td>
            <td th:text="${#temporals.format(p.publishTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/product/detail/' + ${p.productId}}">详情</a>
                <a class="btn btn-sm btn-outline-warning" th:if="${p.status == 'ON_SALE'}" th:href="@{'/product/off/' + ${p.productId}}">下架</a>
                <a class="btn btn-sm btn-outline-success" th:if="${p.status == 'OFF_SALE'}" th:href="@{'/product/on/' + ${p.productId}}">上架</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{'/product/delete/' + ${p.productId}}"
                   onclick="return confirm('确认删除该商品吗？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
