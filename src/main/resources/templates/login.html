<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - 校园二手交易系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background: linear-gradient(120deg,#dfe9f3,#ffffff);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .login-box{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:16px;
            box-shadow:0 8px 30px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2 class="text-center mb-4">校园二手交易系统</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form method="post" th:action="@{/doLogin}">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>

    <div class="text-center mt-3">
        还没有账号？<a th:href="@{/register}">去注册</a>
    </div>


</div>
</body>
</html>
