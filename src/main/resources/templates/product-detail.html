<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .main-img{
            width:100%;
            max-height:420px;
            object-fit:cover;
            border-radius:12px;
        }
        .msg-box{
            background:#f8f9fa;
            border-radius:10px;
            padding:12px;
            margin-bottom:10px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">校园二手交易系统</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/index}">首页</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/product/list}">返回列表</a>
            <a class="btn btn-warning btn-sm" th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <img th:src="${product.imageUrl}" class="main-img" alt="商品图片">
        </div>
        <div class="col-md-6">
            <h2 th:text="${product.productName}">商品名称</h2>
            <p class="text-danger fs-3 fw-bold">¥<span th:text="${product.price}"></span></p>
            <p>原价：<span th:text="${product.originalPrice}"></span></p>
            <p>成色：<span th:text="${product.qualityLevel}"></span></p>
            <p>分类：<span th:text="${product.categoryName}"></span></p>
            <p>卖家：<span th:text="${product.sellerName}"></span></p>
            <p>状态：
                <span class="badge bg-success" th:if="${product.status == 'ON_SALE'}">在售</span>
                <span class="badge bg-secondary" th:if="${product.status == 'OFF_SALE'}">下架</span>
                <span class="badge bg-danger" th:if="${product.status == 'SOLD'}">已售</span>
            </p>
            <p>描述：</p>
            <div class="border rounded p-3 bg-light" th:text="${product.productDesc}"></div>

            <div class="mt-3">
                <a class="btn btn-success"
                   th:if="${product.status == 'ON_SALE'}"
                   th:href="@{'/order/create/' + ${product.productId}}">
                    立即购买
                </a>

                <a class="btn btn-outline-danger"
                   th:if="${!isFavorite}"
                   th:href="@{'/favorite/add/' + ${product.productId}}">
                    收藏
                </a>

                <a class="btn btn-outline-secondary"
                   th:if="${isFavorite}"
                   th:href="@{'/favorite/remove/' + ${product.productId}}">
                    取消收藏
                </a>
            </div>
        </div>
    </div>

    <hr class="my-4">

    <h4>留言区</h4>
    <form method="post" th:action="@{/message/add}" class="mb-3">
        <input type="hidden" name="productId" th:value="${product.productId}">
        <div class="mb-3">
            <textarea name="content" class="form-control" rows="3" placeholder="请输入留言内容" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">发表评论</button>
    </form>

    <div th:if="${#lists.isEmpty(messages)}" class="text-muted">暂无留言</div>

    <div th:each="m : ${messages}" class="msg-box">
        <div class="fw-bold">
            <span th:text="${m.username}">用户名</span>
            <span class="text-muted small ms-2" th:text="${#temporals.format(m.messageTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
        </div>
        <div th:text="${m.content}"></div>
    </div>
</div>
</body>
</html>
